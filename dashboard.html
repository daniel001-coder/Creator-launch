<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard – CreatorLaunch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css"></head>
<body><div id="load">Loading…</div>
<div id="view" hidden>
<section class="card hello"><h1 id="hi">Welcome back!</h1><p class="sub">Keep building your channel today.</p></section>
<div class="stats"><div class="card stat"><b>Active</b><span>Account status</span></div><div class="card stat"><b id="nc">–</b><span>Courses available</span></div><div class="card stat"><b id="nl">–</b><span>Upcoming live classes</span></div></div>
<section class="card live"><h2>Next Live Class</h2><div id="next"><p>Loading…</p></div><a class="btn gold" href="live.html">All classes →</a></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script>
const when=(iso,tz)=>new Date(iso).toLocaleString(undefined,{weekday:"long",day:"numeric",month:"short",hour:"numeric",minute:"2-digit",timeZoneName:"short"});
boot({page:"dashboard",paid:true}).then(async c=>{
 if(!c)return;
 $("hi").textContent="Welcome back, "+c.name.split(" ")[0]+"! 👋";
 const [{data:cl},{count}]=await Promise.all([
  sb.from("live_classes").select("*").eq("published",true).gte("starts_at",new Date().toISOString()).order("starts_at"),
  sb.from("courses").select("id",{count:"exact",head:true}).eq("published",true)]);
 $("nc").textContent=count||0;$("nl").textContent=(cl||[]).length;
 const n=cl&&cl[0];
 if(!n){$("next").innerHTML="<p>No live class scheduled yet. Check back soon.</p>";return;}
 $("next").innerHTML=`<p><b>${esc(n.title)}</b><br>${esc(when(n.starts_at))}<br><b id="cd"></b></p>`;
 function tick(){const s=Math.max(0,Math.floor((new Date(n.starts_at)-new Date())/1000));$("cd").textContent="Starts in "+Math.floor(s/86400)+"d "+Math.floor(s%86400/3600)+"h "+Math.floor(s%3600/60)+"m";}
 tick();setInterval(tick,30000);});
</script></body></html>
