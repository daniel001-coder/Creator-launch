<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Affiliate – CreatorLaunch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css"></head>
<body><div id="load">Loading…</div>
<div id="view" hidden>
<h1>Affiliate &amp; Courses</h1><p class="sub">Buy a course, or copy your personal link and earn a commission every time someone buys through it.</p>
<div id="grid" class="grid"><div class="card">Loading…</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script>
boot({page:"affiliate",paid:true}).then(async c=>{
 if(!c)return;
 const {data}=await sb.from("courses").select("*").eq("published",true).eq("status","approved").order("created_at",{ascending:false});
 const base=new URL("buy.html",location.href).href;
 $("grid").innerHTML=(data&&data.length)?data.map(x=>{
  const earn=Math.floor(x.price_kobo*x.affiliate_percent/100);
  return `<div class="card cc">${cardImg(x)}<div class="b"><b>${esc(x.title)}</b><div class="clamp">${esc(x.description)}</div>
   <div><b style="color:var(--p);font-size:18px">${money(x.price_kobo)}</b> <span class="tag green">You earn ${money(earn)} (${x.affiliate_percent}%)</span></div>
   <div class="acts" style="margin-top:auto"><a class="btn sm" href="buy.html?c=${x.id}">Buy</a><button class="btn sm" type="button" data-copy="${base}?c=${x.id}&amp;ref=${c.user.id}">Copy link</button></div></div></div>`}).join(""):'<div class="card">No courses available yet.</div>';
 $("grid").onclick=async e=>{const u=e.target.dataset.copy;if(!u)return;
  try{await navigator.clipboard.writeText(u)}catch(_){const t=document.createElement("input");t.value=u;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();}
  e.target.textContent="Copied!";setTimeout(()=>e.target.textContent="Copy link",1500);};});
</script></body></html>
